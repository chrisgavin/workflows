on:
  workflow_call:
    inputs:
      environment:
        description: "The environment to create the deployment for."
        type: string
        required: false
        default: "production"
      label:
        description: "If set, only pull requests with this label are considered."
        type: string
        required: false
        default: ""
    secrets:
      token:
        description: "The token to create the deployment with. It only needs to be able to write deployments, and a deployment created with the built-in token would not trigger the deploy."
        required: true

# Everything except creating the deployment uses the built-in token, which therefore only needs to read.
permissions:
  checks: read
  contents: read
  deployments: read
  pull-requests: read
  statuses: read

jobs:
  auto-deploy:
    runs-on: ubuntu-slim
    concurrency:
      group: auto-deploy-${{ inputs.environment }}
      cancel-in-progress: false
    steps:
      - name: Find First Eligible Pull Request
        id: find
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          LABEL: ${{ inputs.label }}
        with:
          script: |
            const {owner, repo} = context.repo;
            const environment = process.env.ENVIRONMENT;
            const label = process.env.LABEL;

            const terminalStates = ["success", "failure", "error", "inactive"];
            const successfulConclusions = ["success", "skipped", "neutral"];

            // Sorted here rather than relying on the order the API happens to return them in.
            const newestFirst = (first, second) =>
              second.created_at.localeCompare(first.created_at) || second.id - first.id;

            const {data: deployments} = await github.rest.repos.listDeployments({
              owner,
              repo,
              environment,
            });
            for (const deployment of deployments) {
              const {data: statuses} = await github.rest.repos.listDeploymentStatuses({
                owner,
                repo,
                deployment_id: deployment.id,
                per_page: 100,
              });
              const [latestStatus] = statuses.sort(newestFirst);
              if (latestStatus === undefined || !terminalStates.includes(latestStatus.state)) {
                const described = latestStatus === undefined ? "has no status reported" : `is ${latestStatus.state}`;
                core.info(`Deployment ${deployment.id} to ${environment} ${described}. Not deploying.`);
                return;
              }
            }

            // Oldest first, so that a pull request cannot be starved by newer ones.
            const pullRequestPages = github.paginate.iterator(github.rest.pulls.list, {
              owner,
              repo,
              state: "open",
              sort: "created",
              direction: "asc",
              per_page: 100,
            });

            for await (const {data: pullRequests} of pullRequestPages) {
              for (const pullRequest of pullRequests) {
                const number = pullRequest.number;
                const sha = pullRequest.head.sha;
                const ref = pullRequest.head.ref;

                const labelled = label === "" || pullRequest.labels.some((candidate) => candidate.name === label);
                if (pullRequest.user.login !== "renovate[bot]" || pullRequest.draft || !labelled) {
                  continue;
                }

                // Recorded against the branch rather than the commit, so that updating the pull request does not
                // make a second attempt happen on its own. Branch names are reused once a pull request is merged,
                // so only deployments created since this one was opened count as attempts at it.
                const {data: previousDeployments} = await github.rest.repos.listDeployments({
                  owner,
                  repo,
                  environment,
                  ref,
                  per_page: 100,
                });
                const attempted = previousDeployments.some((deployment) =>
                  Date.parse(deployment.created_at) >= Date.parse(pullRequest.created_at)
                );
                if (attempted) {
                  core.info(`Pull request #${number} has already been attempted on ${ref}.`);
                  continue;
                }

                const {data: comparison} = await github.rest.repos.compareCommitsWithBasehead({
                  owner,
                  repo,
                  basehead: `${pullRequest.base.ref}...${sha}`,
                });
                if (comparison.behind_by !== 0) {
                  core.info(`Pull request #${number} is ${comparison.behind_by} commit(s) behind ${pullRequest.base.ref}.`);
                  continue;
                }

                const checkRuns = await github.paginate(github.rest.checks.listForRef, {
                  owner,
                  repo,
                  ref: sha,
                  per_page: 100,
                });
                const unsuccessfulChecks = checkRuns.filter((candidate) =>
                  !successfulConclusions.includes(candidate.conclusion)
                );
                if (unsuccessfulChecks.length !== 0) {
                  core.info(`Pull request #${number} has checks that have not succeeded: ${unsuccessfulChecks.map((candidate) => candidate.name).join(", ")}`);
                  continue;
                }

                const {data: combinedStatus} = await github.rest.repos.getCombinedStatusForRef({
                  owner,
                  repo,
                  ref: sha,
                });
                if (combinedStatus.total_count !== 0 && combinedStatus.state !== "success") {
                  core.info(`Pull request #${number} has a combined commit status of ${combinedStatus.state}.`);
                  continue;
                }

                // Nothing has reported on the commit yet, so there is no evidence that it is good rather than untested.
                if (checkRuns.length === 0 && combinedStatus.total_count === 0) {
                  core.info(`Pull request #${number} has no checks or statuses yet.`);
                  continue;
                }

                core.info(`Pull request #${number} is eligible.`);
                core.setOutput("number", number);
                core.setOutput("ref", ref);
                return;
              }
            }

            core.info("No eligible pull request was found.");

      - name: Create Deployment
        if: ${{ steps.find.outputs.ref != '' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          NUMBER: ${{ steps.find.outputs.number }}
          REF: ${{ steps.find.outputs.ref }}
        with:
          github-token: ${{ secrets.token }}
          script: |
            const {owner, repo} = context.repo;

            // The branch is recorded as the ref so that the check for previous attempts can find it. Auto-merging
            // is refused because it would return a merge commit instead of a deployment, leaving nothing to
            // record the attempt.
            const {data: deployment} = await github.rest.repos.createDeployment({
              owner,
              repo,
              ref: process.env.REF,
              environment: process.env.ENVIRONMENT,
              auto_merge: false,
              required_contexts: [],
            });
            core.info(`Created deployment ${deployment.id} for pull request #${process.env.NUMBER} at ${deployment.sha}.`);
